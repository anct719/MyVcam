name: Build MyVCAM Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          cd MyVCAMTweak
          make clean 2>/dev/null || true
          make package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: myvcam-tweak
          path: MyVCAMTweak/packages/*.deb
