name: Build MyVCAM Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install Theos
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid xz
          git clone --recursive --depth=1 --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: myvcam-tweak
          path: packages/*.deb
          if-no-files-found: error
