name: Build MyVCAM Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS 16.2 SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o $HOME/theos/sdks/iPhoneOS16.2.sdk.zip \
            "$(curl -s https://api.github.com/repos/xybp888/iOS-SDKs/releases/tags/16.2 | grep -o 'https://.*iPhoneOS16.2.sdk.zip[^"]*' | head -1)"
          cd $HOME/theos/sdks && unzip -q iPhoneOS16.2.sdk.zip
          echo "THEOS_SDKS=$HOME/theos/sdks" >> $GITHUB_ENV

      - name: Build
        run: |
          cd MyVCAMTweak
          make clean 2>/dev/null || true
          make package
          echo "DEB=$(ls packages/*.deb 2>/dev/null)" >> $GITHUB_ENV

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: myvcam-tweak
          path: MyVCAMTweak/packages/*.deb
